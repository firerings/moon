name: Build APK
on:
  push:
    branches: [main]
    paths: ["app/**", "build.gradle.kts", "settings.gradle.kts", "gradle.properties", ".github/workflows/build.yml"]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.9
      - name: Restaurar keystore
        run: echo "${{ secrets.KEYSTORE_B64 }}" | base64 -d > "$RUNNER_TEMP/moon.jks"
      - run: gradle assembleDebug --no-daemon
        env:
          KEYSTORE_PATH: ${{ runner.temp }}/moon.jks
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
      - run: cp app/build/outputs/apk/debug/app-debug.apk Moon-${{ github.run_number }}.apk
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v0.1.${{ github.run_number }}
          name: Moon 0.1.${{ github.run_number }}
          files: Moon-${{ github.run_number }}.apk
